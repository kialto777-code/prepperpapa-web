<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrepperPapa – fiók törlése</title>
<meta name="robots" content="noindex">
<!-- ACCOUNT DELETION, THE PUBLIC WEB ROUTE (store compliance, 2026-10-27; Google Play "delete account URL").
     Served by the gate at /gate/fiok-torles (outside the gate, no login needed). The same file also works as a static
     page elsewhere (e.g. prepperpapa.hu/fiok-torles/): then it calls https://app.prepperpapa.hu cross-site, and the
     gate allows that origin (K.torlesOriginek). Flow: e-mail -> 6-digit code by e-mail (only if an account exists; the
     page says the SAME thing either way) -> code + explicit consent -> deleted. No inline event handlers, no external
     resources: everything is in this file. -->
<style>
  :root { --hatter:#0B1613; --kartya:#13241f; --szoveg:#e8efe9; --halvany:#9fb3a6; --zold:#2f7a4a; --hiba:#ff8a80; --piros:#c0392b; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--hatter); color:var(--szoveg); }
  main { max-width:520px; margin:0 auto; padding:24px 16px 40px; }
  h1 { font-size:22px; margin:0 0 8px; }
  h2 { font-size:16px; margin:0 0 8px; }
  p { line-height:1.5; margin:0 0 10px; }
  ul { margin:0 0 10px; padding-left:20px; line-height:1.5; }
  .halvany { color:var(--halvany); font-size:14px; }
  .figyelem { font-weight:600; }
  .kartya { background:var(--kartya); border-radius:14px; padding:16px; margin-bottom:14px; }
  label { display:block; font-size:14px; color:var(--halvany); margin:10px 0 4px; }
  input[type=email], input[type=text] { width:100%; padding:12px; font-size:16px; border-radius:8px; border:1px solid #2c4a3e; background:#0e1c18; color:var(--szoveg); }
  .jelolo { display:flex; gap:10px; align-items:flex-start; margin:12px 0 0; font-size:15px; color:var(--szoveg); }
  .jelolo input { width:20px; height:20px; margin-top:2px; flex:none; }
  button { display:block; width:100%; padding:14px; border:0; border-radius:10px; font-size:16px; font-weight:600; cursor:pointer; margin-top:12px; }
  .fo { background:#e8efe9; color:#173d27; border:2px solid var(--zold); }
  .torol { background:var(--piros); color:#fff; }
  button:disabled { opacity:.55; cursor:default; }
  .masodik { background:transparent; color:var(--halvany); font-weight:500; text-decoration:underline; }
  .uzenet { min-height:20px; margin-top:10px; font-size:14px; }
  .uzenet.hiba { color:var(--hiba); }
  .fejlec { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px; }
  select { padding:6px 8px; font-size:14px; border-radius:8px; background:#0e1c18; color:var(--szoveg); border:1px solid #2c4a3e; }
  [hidden] { display:none !important; }
  a { color:#cfe0d4; }
</style>
</head>
<body>
<main>
  <div class="fejlec">
    <strong>PrepperPapa</strong>
    <select id="nyelv" aria-label="Nyelv / Language">
      <option value="hu">Magyar</option><option value="en">English</option><option value="de">Deutsch</option>
      <option value="es">Español</option><option value="pl">Polski</option><option value="ro">Română</option>
      <option value="ru">Русский</option><option value="uk">Українська</option>
    </select>
  </div>
  <h1 data-t="cim"></h1>
  <p data-t="bevezeto"></p>
  <p class="halvany" data-t="appban"></p>

  <div class="kartya">
    <h2 data-t="mi_torlodik"></h2>
    <ul data-l="torlodik"></ul>
    <h2 data-t="mi_marad"></h2>
    <ul data-l="marad"></ul>
  </div>

  <div class="kartya" id="lepes1">
    <label for="email" data-t="email_cimke"></label>
    <input type="email" id="email" autocomplete="email" inputmode="email" maxlength="254">
    <button class="fo" id="kodKer" data-t="kod_kuldes"></button>
    <div class="uzenet" id="uz1" role="status"></div>
  </div>

  <div class="kartya" id="lepes2" hidden>
    <p data-t="kod_elkuldve"></p>
    <label for="kod" data-t="kod_cimke"></label>
    <input type="text" id="kod" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]*">
    <p class="figyelem" data-t="mentes_figyelem"></p>
    <label class="jelolo"><input type="checkbox" id="ertem"><span data-t="ertem"></span></label>
    <button class="torol" id="torol" disabled data-t="torles_gomb"></button>
    <button class="masodik" id="ujKod" data-t="uj_kod"></button>
    <div class="uzenet" id="uz2" role="status"></div>
  </div>

  <div class="kartya" id="kesz" hidden>
    <h2 data-t="kesz_cim"></h2>
    <p data-t="kesz_szoveg"></p>
  </div>

  <p class="halvany"><span data-t="kerdes"></span> <a href="mailto:prepperpapa@gmail.com">prepperpapa@gmail.com</a></p>
</main>

  var NYELVEK = Object.keys(T);
  // served by the gate -> same origin; anywhere else -> the gate's public address (CORS allowed for listed origins)
  var ALAP = location.pathname.indexOf('/gate/') === 0 ? '' : 'https://app.prepperpapa.hu';
  var $ = function (id) { return document.getElementById(id); };

  function nyelvValaszt() {
    var q = (new URLSearchParams(location.search).get('lang') || '').slice(0, 2).toLowerCase();
    if (NYELVEK.indexOf(q) >= 0) return q;
    var l = navigator.languages || [navigator.language || ''];
    for (var i = 0; i < l.length; i++) { var n = String(l[i] || '').slice(0, 2).toLowerCase(); if (NYELVEK.indexOf(n) >= 0) return n; }
    return 'en';
  }
  var ny = nyelvValaszt();
  function t(k) { return (T[ny] && T[ny][k] != null) ? T[ny][k] : T.en[k]; }
  function rajzol() {
    document.documentElement.lang = ny;
    document.title = 'PrepperPapa – ' + t('cim');
    $('nyelv').value = ny;
    var el = document.querySelectorAll('[data-t]');
    for (var i = 0; i < el.length; i++) el[i].textContent = t(el[i].getAttribute('data-t'));
    var ls = document.querySelectorAll('[data-l]');
    for (var j = 0; j < ls.length; j++) {
      var ul = ls[j]; ul.textContent = '';
      t(ul.getAttribute('data-l')).forEach(function (s) { var li = document.createElement('li'); li.textContent = s; ul.appendChild(li); });
    }
  }
  function uzen(id, kulcs, hiba) { var e = $(id); e.textContent = kulcs ? t(kulcs) : ''; e.className = 'uzenet' + (hiba ? ' hiba' : ''); }
  function post(ut, obj) {
    return fetch(ALAP + ut, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(obj) })
      .then(function (v) { return v.json().catch(function () { return {}; }).then(function (j) { return { st: v.status, j: j }; }); });
  }
  function emailJo(e) { return /^[^\s@]{1,64}@[^\s@]{1,190}\.[^\s@]{2,}$/.test(e); }

  function kodKer() {
    var email = $('email').value.trim().toLowerCase();
    if (!emailJo(email)) return uzen('uz1', 'h_email', true);
    $('kodKer').disabled = true; uzen('uz1', '');
    post('/gate/fiok-torles/kod', { email: email, nyelv: ny }).then(function (r) {
      $('kodKer').disabled = false;
      if (r.st === 200) { $('lepes1').hidden = true; $('lepes2').hidden = false; uzen('uz2', ''); $('kod').focus(); return; }
      uzen('uz1', r.st === 429 ? 'h_sok' : r.st === 400 ? 'h_email' : 'h_szerver', true);
    }, function () { $('kodKer').disabled = false; uzen('uz1', 'h_halo', true); });
  }
  function gombAllit() { $('torol').disabled = !($('ertem').checked && /^\d{6}$/.test($('kod').value.trim())); }
  function torol() {
    var kod = $('kod').value.trim();
    if (!/^\d{6}$/.test(kod)) return uzen('uz2', 'h_kod', true);
    if (!$('ertem').checked) return;
    $('torol').disabled = true; uzen('uz2', '');
    post('/gate/fiok-torles/megerosit', { email: $('email').value.trim().toLowerCase(), kod: kod }).then(function (r) {
      if (r.st === 200 && r.j && r.j.ok) { $('lepes2').hidden = true; $('lepes1').hidden = true; $('kesz').hidden = false; return; }
      gombAllit();
      if (r.st === 401) return uzen('uz2', r.j && r.j.lejart ? 'h_lejart' : 'h_hibas', true);
      uzen('uz2', r.st === 429 ? 'h_sok' : 'h_szerver', true);
    }, function () { gombAllit(); uzen('uz2', 'h_halo', true); });
  }
  $('nyelv').addEventListener('change', function () { ny = this.value; rajzol(); });
  $('kodKer').addEventListener('click', kodKer);
  $('email').addEventListener('keydown', function (e) { if (e.key === 'Enter') kodKer(); });
  $('kod').addEventListener('input', gombAllit);
  $('ertem').addEventListener('change', gombAllit);
  $('torol').addEventListener('click', torol);
  $('ujKod').addEventListener('click', function () { $('lepes2').hidden = true; $('lepes1').hidden = false; $('kod').value = ''; $('ertem').checked = false; gombAllit(); uzen('uz1', ''); });
